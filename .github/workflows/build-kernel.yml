name: Build KernelSU Next for Redmi Note 10 Pro
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest
    steps:
    - name: Setup environment
      run: |
        sudo apt update && sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.1-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libelf-dev
        
    - name: Download Clang Toolchain
      run: |
        mkdir clang
        cd clang
        curl -LO https://googlesource.com
        tar -xf clang-r530567.tar.gz
        
    - name: Fetch Kernel Source
      run: |
        git clone https://github.com -b 14 --depth=1 kernel-src
        
    - name: Setup KernelSU Next
      run: |
        cd kernel-src
        curl -LSs "https://githubusercontent.com" | bash -s main

    - name: Build Kernel
      run: |
        cd kernel-src
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH="$(pwd)/../clang/bin:$PATH"
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        
        make O=out sweet_defconfig
        echo "CONFIG_KERNELSU=y" >> out/.config
        make -j$(nproc --all) O=out CC=clang

    - name: Pack Kernel with AnyKernel3
      run: |
        git clone https://github.com -b master AnyKernel3
        cp kernel-src/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cd AnyKernel3
        zip -r9 ../AnyKernel3-sweet-KSU-Next.zip *

    - name: Upload Result
      uses: actions/upload-artifact@v4
      with:
        name: KernelSU-Next-Sweet
        path: AnyKernel3-sweet-KSU-Next.zip
